name: Analyze Market Signals

on:
  schedule:
    - cron: '0 * * * *'    # Runs hourly
  workflow_dispatch:       # Allows manual run

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      SIGNAL_FILE: signals.json
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached signals.json
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: signals.json
          key: signal-cache-${{ github.sha }}
          restore-keys: |
            signal-cache-

      - name: Before run - Show signals.json
        run: |
          echo "🔹 signals.json before run:"
          cat signals.json || echo "❌ signals.json not found"

      - name: Run analysis script
        run: python asset_analyser.py

      - name: After run - Show signals.json
        run: |
          echo "🔹 signals.json after run:"
          cat signals.json || echo "❌ signals.json not found"

      - name: Save updated signals.json to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: signals.json
          key: signal-cache-${{ github.run_id }}-updated
