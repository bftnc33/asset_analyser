name: Analyze Market Signals

on:
  schedule:
    - cron: '0 * * * *'    # Runs hourly
  workflow_dispatch:       # Allows manual run

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      SIGNAL_FILE: signals.json
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached signals.json
        id: cache-signals
        uses: actions/cache@v4
        with:
          path: signals.json
          key: signal-cache
          restore-keys: |
            signal-cache
      
      - name: Debug env vars
        run: |
          echo "EMAIL_ADDRESS is ${EMAIL_ADDRESS:+set}"
          echo "TELEGRAM_TOKEN is ${TELEGRAM_TOKEN:+set}"

      - name: Print signals.json BEFORE analysis
        if: always()
        run: |
          echo "---- signals.json BEFORE ----"
          cat signals.json || echo "No signals.json found"

      - name: Run analysis script
        run: python asset_analyser.py

      - name: Print signals.json AFTER analysis
        if: always()
        run: |
          echo "---- signals.json AFTER ----"
          cat signals.json || echo "signals.json not created"

      - name: Save updated signals.json to cache
        uses: actions/cache/save@v4
        with:
          path: signals.json
          key: signal-cache
